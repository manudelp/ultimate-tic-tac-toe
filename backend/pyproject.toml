[project]
name = "ultimate-tic-tac-toe-backend"
version = "0.1.0"
description = "Flask + SocketIO backend for Ultimate Tic Tac Toe"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-socketio>=5.6.1",
    "gevent>=26.4.0",
    "gunicorn>=25.3.0",
    "numpy>=2.4.4",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false


