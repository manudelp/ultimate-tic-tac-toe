name: Deploy Backend to Server

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/utictactoe-backend:latest

      - name: Build and push nginx Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/utictactoe-nginx:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy to Server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            # Pull the latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/utictactoe-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/utictactoe-nginx:latest
            
            # Stop and remove existing containers if they exist
            docker compose -f ~/utictactoe/docker-compose.yml down || true
            
            # Make sure directory exists
            mkdir -p ~/utictactoe
            
            # Create or update docker-compose file
            cat > ~/utictactoe/docker-compose.yml << 'COMPOSE'
          version: '3'
          services:
            backend:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/utictactoe-backend:latest
              restart: always
            nginx:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/utictactoe-nginx:latest
              ports:
                - "80:80"
              depends_on:
                - backend
              restart: always
          COMPOSE
            
            # Start the containers
            cd ~/utictactoe && docker compose up -d
          EOF
