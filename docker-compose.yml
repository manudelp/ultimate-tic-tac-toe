services:
  backend:
    image: ${DOCKERHUB_USERNAME:-username}/utictactoe-backend:latest
    restart: always
    expose:
      - "5000"
    networks:
      - utictactoe

  nginx:
    image: ${DOCKERHUB_USERNAME:-username}/utictactoe-nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/app.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - utictactoe
    restart: always

networks:
  utictactoe:
    driver: bridge
